name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, intl, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: Check PHP code style
        run: vendor/bin/pint --test

      - name: Lint frontend
        run: npx eslint resources/js --ext .js,.jsx,.ts,.tsx --ignore-path .gitignore

      # Type-checks with tsc and produces the Vite manifest the feature tests render against.
      - name: Build frontend
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: vendor/bin/pest --compact
